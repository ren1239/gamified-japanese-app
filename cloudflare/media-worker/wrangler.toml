# Lesson-video Worker for Nihongo ToGo (see src/index.js and CLAUDE.md §14).
# Deploy:  cd cloudflare/media-worker && npx wrangler deploy
# Key:     npx wrangler secret put MEDIA_KEY   (the same key goes in the app: Settings → Lesson videos)
name = "nihongo-media"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Workers Cache: Cloudflare keeps each full video at the edge (keyed by path + ?k=) and answers
# byte ranges from it, so seeks don't wait on R2. Shared across deploys since files rarely change;
# after re-uploading a file, purge it (dashboard → Workers → nihongo-media → Cache).
[cache]
enabled = true
cross_version_cache = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nihongo-lessons"
